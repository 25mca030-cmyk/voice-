name: Keep Render voice servers awake
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping Singapore voice server (used for calls)
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://voice-os-singapore.onrender.com/health
      - name: Ping Oregon voice server (old, until it is deleted)
        continue-on-error: true
        run: curl -fsS --retry 2 --retry-delay 10 --max-time 60 https://voice-os-ug19.onrender.com/health
