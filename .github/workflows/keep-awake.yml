name: Keep Render voice server awake (backup)
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Singapore voice server
        run: curl -fsS --retry 2 --retry-delay 10 --max-time 60 https://voice-os-singapore.onrender.com/health
